[package]
name = "agent-usage-monitor-ui"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
agent-usage-monitor-core = { path = "../agent-monitor-core" }
slint.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
windows-sys.workspace = true
chrono.workspace = true
raw-window-handle.workspace = true
semver = "1"

# Encodes the notification identity PNG and decodes embedded provider marks.
png = "0.18"
# Rasterizes provider SVGs so their transparent margins can be trimmed like PNGs.
# Same version Slint already builds for its own SVG rendering (no new crates).
resvg = { version = "0.49", default-features = false }

[target.'cfg(windows)'.dependencies]
# WinRT toast notifications (ToastNotificationManager) and, in the MSIX build,
# the package StartupTask (Windows.ApplicationModel) and the package's own
# data folder (Windows.Storage.ApplicationData); RoInitialize for the threads
# that call them (Win32_System_WinRT; Win32_System_Com for the STA test).
windows = { version = "0.62.2", features = ["ApplicationModel", "Data_Xml_Dom", "Foundation", "Storage", "Storage_Search", "UI_Notifications", "Win32_System_Com", "Win32_System_WinRT"] }

[build-dependencies]
slint-build.workspace = true

[[bin]]
name = "agent-usage-monitor"
path = "src/main.rs"
